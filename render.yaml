version: "1"

databases:
  - name: car-inventory-db
    databaseName: adityawandhare
    user: postgres
    plan: free

services:
  - type: web
    name: car-inventory-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python init_db.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: car-inventory-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"
